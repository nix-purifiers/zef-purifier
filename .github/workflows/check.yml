name: check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: python3 tests/eval-errors.py
      - run: nix flake check -L
      - run: python3 tests/conformance.py
      - run: python3 tests/capture.py
      - run: nix build .#checks.$(nix eval --impure --raw --expr builtins.currentSystem).environment --rebuild --no-link
